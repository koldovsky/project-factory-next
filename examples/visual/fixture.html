<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes — visual factory fixture</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #192f28; background: #f6f3e9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 24px 0; font-size: 56px; line-height: 1.05; letter-spacing: -2px; }
    p { max-width: 560px; line-height: 1.6; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 32px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input, button { min-height: 48px; border: 2px solid #192f28; border-radius: 4px; font: inherit; padding: 10px 14px; }
    input { width: 260px; max-width: 100%; color: #192f28; background: white; }
    button { background: #192f28; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #335649; }
    :focus-visible { outline: 3px solid #a83b18; outline-offset: 3px; }
    #status { min-height: 26px; }
    @media (max-width: 600px) { main { padding: 32px 20px; } h1 { font-size: 38px; letter-spacing: -1px; } }
  </style>
</head>
<body>
  <main id="content">
    <div class="eyebrow">Field Notes</div>
    <h1 id="headline">Make room for a slower Sunday.</h1>
    <p>One thoughtful letter each week, with small ideas for a more considered life.</p>
    <form id="signup">
      <div><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <button id="subscribe" type="submit">Join the list</button>
    </form>
    <p id="status" role="status" aria-live="polite">No noise. Just the good things.</p>
  </main>
  <script>
    document.querySelector('#signup').addEventListener('submit', event => {
      event.preventDefault();
      document.querySelector('#status').textContent = 'You are on the list.';
    });
  </script>
</body>
</html>
